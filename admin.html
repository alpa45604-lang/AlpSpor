
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>AlpSport | Yönetici Paneli</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:#fff;font-family:Arial,sans-serif}
header{padding:18px 6%;background:#0c1b2e;border-bottom:1px solid #263b52;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:900;color:#b8ff35}
.logo span{color:white}
main{width:92%;max-width:1000px;margin:30px auto}
h1{font-size:27px}
h2{font-size:20px}
.panel{background:#102137;border:1px solid #263d55;border-radius:12px;padding:22px;margin-bottom:22px}
input,select{width:100%;padding:13px;margin:7px 0 15px;border:1px solid #40546b;border-radius:7px;background:#091727;color:white;font-size:15px}
label{font-size:13px;color:#bdcadd}
button{padding:12px 17px;border:0;border-radius:7px;background:#b8ff35;color:#07111f;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#30465e;color:white}
.danger{background:#d93636;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match{padding:16px;background:#091727;border:1px solid #30465e;border-radius:9px;margin-top:12px}
.match-buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hidden{display:none!important}
.note{font-size:13px;color:#9fb1c5;line-height:1.5}
.error{color:#ff7777}
.success{color:#b8ff35}
.top-actions{display:flex;gap:8px;align-items:center}
@media(max-width:600px){.grid{grid-template-columns:1fr}header{padding:15px 4%}.logo{font-size:21px}main{width:94%}.panel{padding:16px}}
</style>
</head>
<body>

<header>
 <div class="logo">ALP<span>SPORT</span></div>
 <div class="top-actions">
  <span style="font-size:13px">Yönetim</span>
  <button class="secondary hidden" id="logoutButton" onclick="logout()">ÇIKIŞ</button>
 </div>
</header>

<main>
 <section id="loginSection" class="panel">
  <h1>Yönetici Girişi</h1>
  <p class="note">AlpSport yönetim paneline yalnızca yetkili hesapla giriş yapabilirsin.</p>

  <form id="loginForm">
   <label>Kullanıcı adı</label>
   <input id="username" autocomplete="username" required>

   <label>Şifre</label>
   <input id="password" type="password" autocomplete="current-password" required>

   <button type="submit" id="loginButton">GİRİŞ YAP</button>
   <p id="loginMessage" class="note"></p>
  </form>
 </section>

 <section id="adminSection" class="hidden">
  <div class="panel">
   <h1>AlpSport Yönetim Paneli</h1>
   <p class="note">Maçlarını ve yayınlarını buradan yönetebilirsin.</p>
  </div>

  <div class="panel">
   <h2 id="formTitle">Yeni Maç Ekle</h2>

   <form id="matchForm">
    <input type="hidden" id="matchId">

    <label>Maç başlığı</label>
    <input id="title" placeholder="Örnek: Süper Lig" required>

    <div class="grid">
     <div>
      <label>Ev sahibi takım</label>
      <input id="homeTeam" placeholder="Galatasaray" required>
     </div>
     <div>
      <label>Deplasman takımı</label>
      <input id="awayTeam" placeholder="Fenerbahçe" required>
     </div>
    </div>

    <div class="grid">
     <div>
      <label>Ev sahibi logo adresi (isteğe bağlı)</label>
      <input id="homeLogo" type="url" placeholder="https://...">
     </div>
     <div>
      <label>Deplasman logo adresi (isteğe bağlı)</label>
      <input id="awayLogo" type="url" placeholder="https://...">
     </div>
    </div>

    <label>Maç tarihi ve saati</label>
    <input id="matchTime" type="datetime-local" required>

    <label>Yayın adresi (HLS / M3U8)</label>
    <input id="streamUrl" type="url" placeholder="https://.../playlist.m3u8">

    <label>Maç durumu</label>
    <select id="status">
     <option value="upcoming">Yaklaşan maç</option>
     <option value="live">Canlı yayın</option>
     <option value="finished">Tamamlandı</option>
    </select>

    <button type="submit" id="saveButton">MAÇI KAYDET</button>
    <button type="button" class="secondary" onclick="resetForm()">TEMİZLE</button>
    <p id="formMessage" class="note"></p>
   </form>
  </div>

  <div class="panel">
   <h2>Eklenen Maçlar</h2>
   <div id="matchList">Maçlar yükleniyor...</div>
  </div>
 </section>
</main>

<script>
const loginSection=document.getElementById("loginSection");
const adminSection=document.getElementById("adminSection");
const loginMessage=document.getElementById("loginMessage");
const formMessage=document.getElementById("formMessage");
const logoutButton=document.getElementById("logoutButton");
const matchList=document.getElementById("matchList");

let matches=[];

async function api(url,options={}){
 const response=await fetch(url,{
  ...options,
  credentials:"same-origin",
  headers:{
   "Content-Type":"application/json",
   ...(options.headers||{})
  }
 });
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(data.error||data.message||"İşlem başarısız.");
 return data;
}

async function checkSession(){
 try{
  await api("/api/me");
  showAdmin();
 }catch(error){
  showLogin();
 }
}

function showLogin(){
 loginSection.classList.remove("hidden");
 adminSection.classList.add("hidden");
 logoutButton.classList.add("hidden");
}

function showAdmin(){
 loginSection.classList.add("hidden");
 adminSection.classList.remove("hidden");
 logoutButton.classList.remove("hidden");
 loadMatches();
}

document.getElementById("loginForm").addEventListener("submit",async event=>{
 event.preventDefault();
 const button=document.getElementById("loginButton");
 button.disabled=true;
 loginMessage.textContent="Giriş kontrol ediliyor...";
 loginMessage.className="note";

 try{
  await api("/api/login",{
   method:"POST",
   body:JSON.stringify({
    username:document.getElementById("username").value,
    password:document.getElementById("password").value
   })
  });
  document.getElementById("password").value="";
  showAdmin();
 }catch(error){
  loginMessage.textContent=error.message;
  loginMessage.className="note error";
 }finally{
  button.disabled=false;
 }
});

async function logout(){
 try{
  await api("/api/logout",{method:"POST",body:"{}"});
 }catch(error){}
 showLogin();
}

function resetForm(){
 document.getElementById("matchForm").reset();
 document.getElementById("matchId").value="";
 document.getElementById("formTitle").textContent="Yeni Maç Ekle";
 document.getElementById("saveButton").textContent="MAÇI KAYDET";
 formMessage.textContent="";
}

document.getElementById("matchForm").addEventListener("submit",async event=>{
 event.preventDefault();

 const id=document.getElementById("matchId").value;
 const payload={
  title:document.getElementById("title").value.trim(),
  home_team:document.getElementById("homeTeam").value.trim(),
  away_team:document.getElementById("awayTeam").value.trim(),
  home_logo:document.getElementById("homeLogo").value.trim(),
  away_logo:document.getElementById("awayLogo").value.trim(),
  match_time:document.getElementById("matchTime").value,
  stream_url:document.getElementById("streamUrl").value.trim(),
  status:document.getElementById("status").value
 };

 const button=document.getElementById("saveButton");
 button.disabled=true;
 formMessage.textContent="Kaydediliyor...";

 try{
  await api("/api/matches",{
   method:id?"PUT":"POST",
   body:JSON.stringify(id?{id,...payload}:payload)
  });
  formMessage.textContent="Maç başarıyla kaydedildi.";
  formMessage.className="note success";
  resetForm();
  await loadMatches();
 }catch(error){
  formMessage.textContent=error.message;
  formMessage.className="note error";
 }finally{
  button.disabled=false;
 }
});

async function loadMatches(){
 matchList.textContent="Maçlar yükleniyor...";
 try{
  const data=await api("/api/matches");
  matches=Array.isArray(data)?data:(data.matches||[]);

  if(!matches.length){
   matchList.textContent="Henüz maç eklenmedi.";
   return;
  }

  matchList.innerHTML=matches.map(match=>`
   <div class="match">
    <strong>${escapeHTML(match.title)}</strong>
    <p>${escapeHTML(match.home_team)} - ${escapeHTML(match.away_team)}</p>
    <p class="note">Durum: ${escapeHTML(match.status)}</p>
    <div class="match-buttons">
     <button class="secondary" onclick="editMatch('${escapeHTML(match.id)}')">DÜZENLE</button>
     <button class="danger" onclick="deleteMatch('${escapeHTML(match.id)}')">SİL</button>
    </div>
   </div>
  `).join("");
 }catch(error){
  matchList.textContent=error.message;
 }
}

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[c]));
}

function editMatch(id){
 const match=matches.find(item=>String(item.id)===String(id));
 if(!match)return;

 document.getElementById("matchId").value=match.id;
 document.getElementById("title").value=match.title||"";
 document.getElementById("homeTeam").value=match.home_team||"";
 document.getElementById("awayTeam").value=match.away_team||"";
 document.getElementById("homeLogo").value=match.home_logo||"";
 document.getElementById("awayLogo").value=match.away_logo||"";
 document.getElementById("matchTime").value=match.match_time||"";
 document.getElementById("streamUrl").value=match.stream_url||"";
 document.getElementById("status").value=match.status||"upcoming";

 document.getElementById("formTitle").textContent="Maçı Düzenle";
 document.getElementById("saveButton").textContent="DEĞİŞİKLİKLERİ KAYDET";
 window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteMatch(id){
 if(!confirm("Bu maçı silmek istediğine emin misin?"))return;

 try{
  await api("/api/matches",{
   method:"DELETE",
   body:JSON.stringify({id})
  });
  await loadMatches();
 }catch(error){
  alert(error.message);
 }
}

checkSession();
</script>
</body>
</html>
